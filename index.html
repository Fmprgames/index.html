<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>⚽ ULTIMATE 11v11 · FOOTBALL ARENA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b1f1a;
      background-image: radial-gradient(circle at 20% 30%, #1f4a34, #05100a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 15px;
      margin: 0;
    }
    .game-wrapper {
      background: linear-gradient(180deg, #1e3b2f 0%, #0f281a 100%);
      border-radius: 70px 70px 50px 50px;
      box-shadow: 0 35px 55px rgba(0,0,0,0.8), inset 0 0 20px #dbb45c;
      padding: 20px 20px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #c9a24d;
      max-width: 1000px;
      width: fit-content;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 20, 15, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 100px;
      padding: 12px 30px;
      margin-bottom: 15px;
      color: #f7e05e;
      font-weight: bold;
      font-size: 1.8rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.7);
      border: 1px solid #b6963c;
    }
    .team-badge {
      background: #1b3822;
      padding: 6px 20px;
      border-radius: 30px;
      color: white;
      font-size: 1.2rem;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 45px;
      background: #2b6e2b;
      box-shadow: inset 0 -10px 30px rgba(0,0,0,0.8), 0 20px 40px black;
      border: 3px solid #c6a144;
      width: 100%;
      height: auto;
      max-width: 850px;
      touch-action: none;
    }
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .btn {
      background: radial-gradient(circle at 30% 30%, #f9e076, #c49b1a);
      border: none;
      border-radius: 40px;
      padding: 14px 25px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #1a3a1a;
      box-shadow: 0 7px 0 #7a5717, 0 10px 20px black;
      cursor: pointer;
      transition: 0.07s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #7a5717; }
    .mobile-actions {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .action-btn {
      background: #2e4b2e;
      color: white;
      font-size: 1.4rem;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 40% 40%, #4e7a4e, #1b381b);
      box-shadow: 0 5px 0 #0f1f0a;
      cursor: pointer;
    }
    .team-select-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: white;
    }
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 700px;
      margin: 25px 0;
    }
    .team-card {
      background: #1e3b2f;
      padding: 15px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.3rem;
      cursor: pointer;
      border: 2px solid #c9a24d;
      transition: 0.2s;
    }
    .team-card:hover { background: #c9a24d; color: black; }
  </style>
</head>
<body>
<div id="teamSelectScreen" class="team-select-screen">
  <h1 style="font-size:2.5rem; color:#f7e05e;">⚽ SELECT YOUR TEAM</h1>
  <div class="team-grid" id="teamGrid"></div>
  <p style="color:#ccc;">Opponent will be a rival AI team</p>
</div>

<div class="game-wrapper">
  <div class="scoreboard">
    <span><span class="team-badge" id="playerTeamName">🇧🇷 BRA</span> <span id="playerScore">0</span></span>
    <span style="font-size:2rem;" id="timerDisplay">90</span>
    <span><span id="aiScore">0</span> <span class="team-badge" id="aiTeamName">🇦🇷 ARG</span></span>
  </div>
  <canvas id="gameCanvas" width="850" height="480"></canvas>
  <div class="control-bar">
    <button class="btn" id="restartButton">↺ RESTART</button>
    <button class="btn" id="switchPlayerBtn">🔄 SWITCH</button>
    <div class="mobile-actions">
      <div class="action-btn" id="btnPass">📤</div>
      <div class="action-btn" id="btnShoot">🥅</div>
      <div class="action-btn" id="btnSprint">💨</div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 850, H = 480;

    // ---------- TEAMS DATABASE ----------
    const TEAMS = [
      { name: "Brazil", code: "BRA", color: "#f1c40f", secondary: "#1e8449" },
      { name: "Argentina", code: "ARG", color: "#75aadb", secondary: "#ffffff" },
      { name: "France", code: "FRA", color: "#0c1c8c", secondary: "#ed2939" },
      { name: "Germany", code: "GER", color: "#ffffff", secondary: "#000000" },
      { name: "England", code: "ENG", color: "#ffffff", secondary: "#cf142b" },
      { name: "Portugal", code: "POR", color: "#b22222", secondary: "#006400" }
    ];

    let playerTeam = TEAMS[0];
    let aiTeam = TEAMS[1];
    let gameActive = false;
    let matchTime = 90;
    let timerInterval = null;
    let playerScore = 0, aiScore = 0;

    // ---------- PLAYER ENTITY CLASS ----------
    class PlayerEntity {
      constructor(x, y, role, teamSide, color, secondary) {
        this.x = x; this.y = y;
        this.role = role; // 'GK','DEF','MID','FWD'
        this.teamSide = teamSide; // 'home' or 'away'
        this.color = color;
        this.secondary = secondary;
        this.radius = 12;
        this.speed = 2.6;
        this.vx = 0; this.vy = 0;
        this.targetX = x; this.targetY = y;
      }
    }

    // Squads
    let homePlayers = [];
    let awayPlayers = [];
    let ball = { x: W/2, y: H/2, vx: 0, vy: 0, radius: 7 };

    // Controlled player index (home team)
    let controlledIdx = 0; // default outfield

    // Input state
    const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };
    let sprintActive = false;
    let passTrigger = false;
    let shootTrigger = false;

    // ---------- INITIALIZE FORMATION ----------
    function createSquad(teamSide, teamColor, secondary) {
      let squad = [];
      const isHome = teamSide === 'home';
      const baseX = isHome ? 140 : W - 140;
      const goalY = H/2;
      // Goalkeeper
      squad.push(new PlayerEntity(isHome ? 35 : W-35, goalY, 'GK', teamSide, teamColor, secondary));
      // Defenders (4)
      const defY = [goalY-75, goalY-25, goalY+25, goalY+75];
      defY.forEach(y => squad.push(new PlayerEntity(isHome ? 90 : W-90, y, 'DEF', teamSide, teamColor, secondary)));
      // Midfielders (4)
      const midY = [goalY-65, goalY-22, goalY+22, goalY+65];
      midY.forEach(y => squad.push(new PlayerEntity(isHome ? 200 : W-200, y, 'MID', teamSide, teamColor, secondary)));
      // Forwards (2)
      squad.push(new PlayerEntity(isHome ? 280 : W-280, goalY-35, 'FWD', teamSide, teamColor, secondary));
      squad.push(new PlayerEntity(isHome ? 280 : W-280, goalY+35, 'FWD', teamSide, teamColor, secondary));
      return squad;
    }

    function resetMatch() {
      if (timerInterval) clearInterval(timerInterval);
      homePlayers = createSquad('home', playerTeam.color, playerTeam.secondary);
      awayPlayers = createSquad('away', aiTeam.color, aiTeam.secondary);
      ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
      playerScore = 0; aiScore = 0;
      matchTime = 90;
      controlledIdx = 1; // start with a midfielder
      gameActive = true;
      updateUI();
      startTimer();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        matchTime--;
        document.getElementById('timerDisplay').textContent = matchTime;
        if (matchTime <= 0) { matchTime = 0; endGame(); }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateUI() {
      document.getElementById('playerScore').textContent = playerScore;
      document.getElementById('aiScore').textContent = aiScore;
      document.getElementById('playerTeamName').textContent = playerTeam.code;
      document.getElementById('aiTeamName').textContent = aiTeam.code;
    }

    // ---------- AI LOGIC PER ROLE ----------
    function updateAITeam() {
      if (!gameActive) return;
      const ballX = ball.x, ballY = ball.y;
      awayPlayers.forEach(p => {
        let targetX = p.x, targetY = p.y;
        const distToBall = Math.hypot(p.x - ballX, p.y - ballY);
        if (p.role === 'GK') {
          targetX = 35;
          targetY = Math.min(H-30, Math.max(30, ballY * 0.8 + H*0.1));
        } else if (p.role === 'DEF') {
          targetX = Math.min(ballX + 45, 170);
          targetY = ballY + (p.y > H/2 ? -20 : 20);
        } else if (p.role === 'MID') {
          targetX = ballX + 20;
          targetY = ballY * 0.7 + p.y * 0.3;
        } else if (p.role === 'FWD') {
          targetX = Math.max(ballX - 30, 220);
          targetY = ballY;
        }
        // move towards target
        let dx = targetX - p.x, dy = targetY - p.y;
        let len = Math.hypot(dx, dy);
        if (len > 2) {
          p.x += (dx/len) * p.speed * 0.9;
          p.y += (dy/len) * p.speed * 0.9;
        }
        // AI kick if near ball
        if (distToBall < 25 && Math.random() < 0.03) {
          let angle = Math.atan2(ballY - p.y, ballX - p.x);
          ball.vx = Math.cos(angle) * 7.5;
          ball.vy = Math.sin(angle) * 7.2;
        }
      });
    }

    function updateHomeAIExceptControlled() {
      if (!gameActive) return;
      homePlayers.forEach((p, idx) => {
        if (idx === controlledIdx) return;
        let targetX = p.x, targetY = p.y;
        if (p.role === 'GK') {
          targetX = W-35; targetY = Math.min(H-30, Math.max(30, ball.y*0.8 + H*0.1));
        } else if (p.role === 'DEF') {
          targetX = Math.max(ball.x - 45, W-170);
          targetY = ball.y + (p.y > H/2 ? -20 : 20);
        } else if (p.role === 'MID') {
          targetX = ball.x - 20;
          targetY = ball.y * 0.7 + p.y * 0.3;
        } else if (p.role === 'FWD') {
          targetX = Math.min(ball.x + 30, W-220);
          targetY = ball.y;
        }
        let dx = targetX - p.x, dy = targetY - p.y;
        let len = Math.hypot(dx, dy);
        if (len > 2) { p.x += (dx/len)*p.speed*0.9; p.y += (dy/len)*p.speed*0.9; }
      });
    }

    // ---------- BALL PHYSICS & GOALS ----------
    function updateBall() {
      ball.vx *= 0.988;
      ball.vy *= 0.988;
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y < 10) { ball.y = 10; ball.vy *= -0.5; }
      if (ball.y > H-10) { ball.y = H-10; ball.vy *= -0.5; }
      // Goals
      if (ball.x < 20 && ball.y > H*0.3 && ball.y < H*0.7) { aiScore++; resetAfterGoal(); }
      if (ball.x > W-20 && ball.y > H*0.3 && ball.y < H*0.7) { playerScore++; resetAfterGoal(); }
    }

    function resetAfterGoal() {
      ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
      updateUI();
    }

    // ---------- PLAYER CONTROL ----------
    function moveControlledPlayer() {
      if (!gameActive || controlledIdx >= homePlayers.length) return;
      let p = homePlayers[controlledIdx];
      let dx = 0, dy = 0;
      if (keys.d || keys.right) dx += 1;
      if (keys.a || keys.left) dx -= 1;
      if (keys.s || keys.down) dy += 1;
      if (keys.w || keys.up) dy -= 1;
      if (dx !== 0 || dy !== 0) {
        let len = Math.hypot(dx, dy);
        let sp = sprintActive ? 4.8 : 3.4;
        p.x += (dx/len) * sp;
        p.y += (dy/len) * sp;
        p.x = Math.min(W-20, Math.max(20, p.x));
        p.y = Math.min(H-20, Math.max(20, p.y));
      }
      // Pass / Shoot
      if (passTrigger) {
        passTrigger = false;
        let target = homePlayers.find((pl, i) => i !== controlledIdx && Math.hypot(pl.x-p.x, pl.y-p.y) < 150);
        if (target) {
          let angle = Math.atan2(target.y - p.y, target.x - p.x);
          ball.vx = Math.cos(angle) * 8;
          ball.vy = Math.sin(angle) * 6;
        }
      }
      if (shootTrigger) {
        shootTrigger = false;
        let angle = Math.atan2((H/2) - p.y, (W-20) - p.x);
        ball.vx = Math.cos(angle) * 9.5;
        ball.vy = Math.sin(angle) * 5.5;
      }
    }

    function switchPlayer() {
      let nearest = controlledIdx;
      let minDist = Infinity;
      homePlayers.forEach((p, i) => {
        if (i === controlledIdx || p.role === 'GK') return;
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < minDist) { minDist = d; nearest = i; }
      });
      controlledIdx = nearest;
    }

    // ---------- RENDERING ----------
    function drawPitch() {
      ctx.fillStyle = '#2d7a2d';
      ctx.fillRect(0,0,W,H);
      for (let i=0;i<W;i+=60) ctx.fillStyle='#3b8c3b', ctx.fillRect(i,0,28,H);
      ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(W/2,H/2,70,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(W/2,H/2,5,0,2*Math.PI); ctx.fill();
    }

    function drawEntity(p) {
      ctx.shadowColor = '#000'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
      ctx.fillStyle = p.color; ctx.fill(); ctx.strokeStyle=p.secondary; ctx.lineWidth=2; ctx.stroke();
      ctx.shadowBlur=0; ctx.shadowColor='transparent';
    }

    function render() {
      drawPitch();
      [...homePlayers, ...awayPlayers].forEach(drawEntity);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius,0,2*Math.PI);
      ctx.fillStyle='white'; ctx.fill(); ctx.strokeStyle='black'; ctx.stroke();
      if (!gameActive) {
        ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#ffd966'; ctx.font='bold 34px sans-serif'; ctx.fillText('MATCH OVER',W/2-120,H/2);
      }
    }

    function gameLoop() {
      if (gameActive) {
        moveControlledPlayer();
        updateHomeAIExceptControlled();
        updateAITeam();
        updateBall();
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    // ---------- EVENT LISTENERS ----------
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'W') { keys.w = true; e.preventDefault(); }
      if (e.key === 'a' || e.key === 'A') { keys.a = true; e.preventDefault(); }
      if (e.key === 's' || e.key === 'S') { keys.s = true; e.preventDefault(); }
      if (e.key === 'd' || e.key === 'D') { keys.d = true; e.preventDefault(); }
      if (e.key === 'ArrowUp') { keys.up = true; e.preventDefault(); }
      if (e.key === 'ArrowDown') { keys.down = true; e.preventDefault(); }
      if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
      if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'ArrowUp') keys.up = false;
      if (e.key === 'ArrowDown') keys.down = false;
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });

    document.getElementById('btnPass').addEventListener('click', ()=> passTrigger=true);
    document.getElementById('btnShoot').addEventListener('click', ()=> shootTrigger=true);
    document.getElementById('btnSprint').addEventListener('mousedown', ()=> sprintActive=true);
    document.getElementById('btnSprint').addEventListener('mouseup', ()=> sprintActive=false);
    document.getElementById('switchPlayerBtn').addEventListener('click', switchPlayer);
    document.getElementById('restartButton').addEventListener('click', resetMatch);

    // Team selection
    const grid = document.getElementById('teamGrid');
    TEAMS.forEach((team, idx) => {
      let card = document.createElement('div');
      card.className = 'team-card';
      card.textContent = team.name;
      card.onclick = () => {
        playerTeam = team;
        aiTeam = TEAMS[(idx+1) % TEAMS.length];
        document.getElementById('teamSelectScreen').style.display = 'none';
        resetMatch();
      };
      grid.appendChild(card);
    });

    resetMatch();
    gameLoop();
  })();
</script>
</body>
</html>
