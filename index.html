<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚽ PRO SOCCER 3D - 11v11 Football Game</title>
  <style>
    :root {
      --bg-dark: #0a1a0f;
      --gold: #f7e05e;
      --panel-bg: rgba(8, 18, 10, 0.95);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a1a0f 0%, #142614 30%, #0d1f0d 60%, #0a1a0f 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
      padding: 10px;
      margin: 0;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Main Game Container */
    .game-container {
      background: linear-gradient(180deg, #1a3525 0%, #0e2216 100%);
      border-radius: 50px 50px 40px 40px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.9),
        0 0 0 3px rgba(201, 162, 77, 0.5),
        inset 0 2px 20px rgba(219, 180, 92, 0.3);
      padding: 15px 15px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 960px;
      width: 100%;
      position: relative;
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50px;
      padding: 10px 20px;
      margin-bottom: 12px;
      color: var(--gold);
      font-weight: bold;
      font-size: 1.4rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 2px solid #b6963c;
      flex-wrap: wrap;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-badge {
      background: linear-gradient(180deg, #1e3b2a, #132a1a);
      padding: 6px 16px;
      border-radius: 25px;
      color: white;
      font-size: 1rem;
      letter-spacing: 1px;
      border: 1px solid #c9a24d;
      white-space: nowrap;
    }

    .score-number {
      font-size: 2rem;
      min-width: 40px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 20px rgba(247, 224, 94, 0.8);
    }

    .timer-display {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 1.6rem;
      color: #ffd966;
      border: 1px solid #c9a24d;
      letter-spacing: 2px;
    }

    /* Canvas */
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 35px;
      background: radial-gradient(ellipse at 50% 40%, #3a8a32, #1a4a14);
      box-shadow: 
        inset 0 -15px 40px rgba(0, 0, 0, 0.8),
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 0 3px #c6a144;
      width: 100%;
      height: auto;
      max-width: 900px;
      touch-action: none;
      cursor: crosshair;
    }

    /* Control Panel */
    .control-panel {
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px solid #b6963c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* D-Pad */
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .dpad-row {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      background: radial-gradient(circle at 40% 40%, #5a7a4a, #1e3312);
      color: white;
      font-size: 1.5rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 4px 0 #0f1f0a,
        0 8px 15px rgba(0, 0, 0, 0.5);
      border: 2px solid #b6a86b;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.05s ease;
      font-weight: bold;
    }

    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f1f0a, 0 4px 10px rgba(0, 0, 0, 0.5);
      background: radial-gradient(circle at 40% 40%, #7a9a6a, #2e4322);
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      touch-action: manipulation;
      border: 2px solid;
      letter-spacing: 0.5px;
      transition: all 0.08s ease;
      white-space: nowrap;
    }

    .btn-pass {
      background: linear-gradient(180deg, #5b9bd5, #2e6da4);
      color: white;
      border-color: #8bc4f0;
      box-shadow: 0 4px 0 #1a4a6e, 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-shoot {
      background: linear-gradient(180deg, #e74c3c, #a93226);
      color: white;
      border-color: #f1948a;
      box-shadow: 0 4px 0 #641e16, 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-sprint {
      background: linear-gradient(180deg, #f39c12, #d68910);
      color: #1a1a1a;
      border-color: #f9e79f;
      box-shadow: 0 4px 0 #7d5a0b, 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-switch {
      background: linear-gradient(180deg, #8e44ad, #6c3483);
      color: white;
      border-color: #bb8fce;
      box-shadow: 0 4px 0 #4a235a, 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-restart {
      background: linear-gradient(180deg, #27ae60, #1e8449);
      color: white;
      border-color: #82e0aa;
      box-shadow: 0 4px 0 #145a32, 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5), 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    /* Speed Control */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .speed-slider {
      width: 80px;
      accent-color: #f7e05e;
      height: 6px;
      cursor: pointer;
    }

    /* Team Selection Screen */
    .team-select-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .select-title {
      font-size: 2.5rem;
      color: #f7e05e;
      text-shadow: 0 0 30px rgba(247, 224, 94, 0.5);
      margin-bottom: 30px;
      text-align: center;
    }

    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      max-width: 700px;
      margin: 20px 0;
      padding: 0 20px;
    }

    .team-card {
      background: linear-gradient(180deg, #1e3b2f, #132a1a);
      padding: 15px 25px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid #c9a24d;
      transition: all 0.3s ease;
      color: white;
      text-align: center;
      min-width: 120px;
    }

    .team-card:hover {
      background: linear-gradient(180deg, #c9a24d, #8b6914);
      color: #000;
      transform: scale(1.08);
      box-shadow: 0 15px 30px rgba(201, 162, 77, 0.4);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .scoreboard {
        font-size: 1rem;
        padding: 8px 12px;
      }
      .score-number {
        font-size: 1.4rem;
      }
      .timer-display {
        font-size: 1.2rem;
        padding: 5px 12px;
      }
      .ctrl-btn {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
      .action-btn {
        padding: 8px 14px;
        font-size: 0.8rem;
      }
      .team-badge {
        padding: 4px 10px;
        font-size: 0.75rem;
      }
      .select-title {
        font-size: 1.8rem;
      }
      .team-card {
        padding: 10px 18px;
        font-size: 1rem;
        min-width: 100px;
      }
    }

    @media (max-width: 480px) {
      .game-container {
        border-radius: 30px;
        padding: 8px;
      }
      canvas {
        border-radius: 20px;
      }
      .control-panel {
        padding: 8px;
        gap: 6px;
      }
      .dpad {
        gap: 1px;
      }
      .dpad-row {
        gap: 4px;
      }
      .ctrl-btn {
        width: 35px;
        height: 35px;
        font-size: 1rem;
      }
      .action-btn {
        padding: 6px 10px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- TEAM SELECTION SCREEN -->
  <div id="teamSelectScreen" class="team-select-overlay">
    <h1 class="select-title">⚽ আপনার দল নির্বাচন করুন</h1>
    <div class="team-grid" id="teamGrid"></div>
    <p style="color:#ccc; margin-top:20px;">প্রতিপক্ষ AI অটোমেটিক সিলেক্ট হবে</p>
  </div>

  <!-- MAIN GAME -->
  <div class="game-container">
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="team-info">
        <span class="team-badge" id="playerTeamName">🇧🇷 BRA</span>
        <span class="score-number" id="playerScore">0</span>
      </div>
      <div class="timer-display" id="timerDisplay">90</div>
      <div class="team-info">
        <span class="score-number" id="aiScore">0</span>
        <span class="team-badge" id="aiTeamName">🇦🇷 ARG</span>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <!-- Control Panel -->
    <div class="control-panel">
      <!-- D-Pad -->
      <div class="dpad">
        <div class="dpad-row">
          <div class="ctrl-btn" id="btnUp">▲</div>
        </div>
        <div class="dpad-row">
          <div class="ctrl-btn" id="btnLeft">◀</div>
          <div class="ctrl-btn" id="btnDown">▼</div>
          <div class="ctrl-btn" id="btnRight">▶</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-group">
        <button class="action-btn btn-pass" id="btnPass">📤 পাস</button>
        <button class="action-btn btn-shoot" id="btnShoot">🥅 শুট</button>
        <button class="action-btn btn-sprint" id="btnSprint">💨 স্প্রিন্ট</button>
        <button class="action-btn btn-switch" id="switchPlayerBtn">🔄 সুইচ</button>
        <button class="action-btn btn-restart" id="restartButton">↺ রিস্টার্ট</button>
      </div>

      <!-- Speed Control -->
      <div class="speed-control">
        <span>🐢</span>
        <input type="range" class="speed-slider" id="speedSlider" min="0.4" max="1.2" value="0.7" step="0.05">
        <span>🐇</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ==================== CANVAS SETUP ====================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const W = 900;
      const H = 500;

      // ==================== TEAMS DATABASE ====================
      const TEAMS = [
        { 
          name: "Brazil", code: "BRA", 
          primary: "#FFD700", secondary: "#006400", 
          skin: "#F5CBA7", hair: "#2C1810",
          flag: "🇧🇷"
        },
        { 
          name: "Argentina", code: "ARG", 
          primary: "#75AADB", secondary: "#FFFFFF", 
          skin: "#E8C39E", hair: "#3B2314",
          flag: "🇦🇷"
        },
        { 
          name: "France", code: "FRA", 
          primary: "#0C1C8C", secondary: "#ED2939", 
          skin: "#F5D7B3", hair: "#1A1A2E",
          flag: "🇫🇷"
        },
        { 
          name: "Germany", code: "GER", 
          primary: "#FFFFFF", secondary: "#000000", 
          skin: "#FDE0C8", hair: "#8B6914",
          flag: "🇩🇪"
        },
        { 
          name: "England", code: "ENG", 
          primary: "#FFFFFF", secondary: "#CF142B", 
          skin: "#F5D0B0", hair: "#4A3728",
          flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿"
        },
        { 
          name: "Portugal", code: "POR", 
          primary: "#B22222", secondary: "#006400", 
          skin: "#E8C49A", hair: "#2C1810",
          flag: "🇵🇹"
        },
        { 
          name: "Netherlands", code: "NED", 
          primary: "#FF6600", secondary: "#FFFFFF", 
          skin: "#F5D5B8", hair: "#8B6914",
          flag: "🇳🇱"
        },
        { 
          name: "Spain", code: "ESP", 
          primary: "#C60B1E", secondary: "#FFC400", 
          skin: "#E8C5A0", hair: "#1A1A2E",
          flag: "🇪🇸"
        }
      ];

      // ==================== GAME STATE ====================
      let playerTeam = TEAMS[0];
      let aiTeam = TEAMS[1];
      let gameActive = false;
      let matchTime = 90;
      let timerInterval = null;
      let playerScore = 0;
      let aiScore = 0;
      let baseSpeed = 0.7; // Default slower speed
      let gameStarted = false;

      // ==================== PLAYER CLASS (3D Humanoid) ====================
      class PlayerEntity {
        constructor(x, y, role, teamSide, team) {
          this.x = x;
          this.y = y;
          this.role = role; // 'GK', 'DEF', 'MID', 'FWD'
          this.teamSide = teamSide; // 'home' or 'away'
          this.team = team;
          this.radius = 10;
          this.baseSpeed = role === 'GK' ? 1.8 : role === 'DEF' ? 2.2 : role === 'MID' ? 2.4 : 2.6;
          this.vx = 0;
          this.vy = 0;
          this.animFrame = Math.random() * Math.PI * 2;
          this.facingAngle = teamSide === 'home' ? 0 : Math.PI;
          this.isSprinting = false;
          this.jerseyNumber = role === 'GK' ? 1 : role === 'DEF' ? Math.floor(Math.random() * 4) + 2 : 
                             role === 'MID' ? Math.floor(Math.random() * 4) + 6 : Math.floor(Math.random() * 3) + 9;
        }

        getSpeed() {
          return this.baseSpeed * baseSpeed;
        }
      }

      // ==================== GAME OBJECTS ====================
      let homePlayers = [];
      let awayPlayers = [];
      let ball = { 
        x: W / 2, y: H / 2, 
        vx: 0, vy: 0, 
        radius: 7, 
        rotation: 0,
        lastKicker: null 
      };
      let controlledIdx = 1; // Default controlled player (first midfielder)

      // ==================== INPUT STATE ====================
      const keys = {
        w: false, a: false, s: false, d: false,
        up: false, down: false, left: false, right: false
      };
      let sprintActive = false;
      let passTrigger = false;
      let shootTrigger = false;

      // ==================== INITIALIZE SQUADS ====================
      function createSquad(teamSide, team) {
        const squad = [];
        const isHome = teamSide === 'home';
        const goalX = isHome ? 25 : W - 25;
        const goalY = H / 2;
        const direction = isHome ? 1 : -1;

        // Goalkeeper
        squad.push(new PlayerEntity(goalX + direction * 5, goalY, 'GK', teamSide, team));

        // Defenders (4 players)
        const defX = goalX + direction * 60;
        const defPositions = [
          goalY - 75, goalY - 25, goalY + 25, goalY + 75
        ];
        defPositions.forEach(y => {
          squad.push(new PlayerEntity(defX, y, 'DEF', teamSide, team));
        });

        // Midfielders (4 players)
        const midX = goalX + direction * 170;
        const midPositions = [
          goalY - 65, goalY - 22, goalY + 22, goalY + 65
        ];
        midPositions.forEach(y => {
          squad.push(new PlayerEntity(midX, y, 'MID', teamSide, team));
        });

        // Forwards (2 players)
        const fwdX = goalX + direction * 260;
        squad.push(new PlayerEntity(fwdX, goalY - 35, 'FWD', teamSide, team));
        squad.push(new PlayerEntity(fwdX, goalY + 35, 'FWD', teamSide, team));

        return squad;
      }

      // ==================== RESET MATCH ====================
      function resetMatch() {
        // Clear existing timer
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        // Create teams
        homePlayers = createSquad('home', playerTeam);
        awayPlayers = createSquad('away', aiTeam);

        // Reset ball
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        ball.rotation = 0;

        // Reset scores
        playerScore = 0;
        aiScore = 0;
        matchTime = 90;

        // Reset control
        controlledIdx = 1;
        gameActive = true;
        gameStarted = true;

        // Update display
        updateScoreDisplay();
        startTimer();
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (!gameActive) return;
          matchTime--;
          document.getElementById('timerDisplay').textContent = matchTime;
          if (matchTime <= 0) {
            matchTime = 0;
            document.getElementById('timerDisplay').textContent = '0';
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        gameActive = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        ball.vx = 0;
        ball.vy = 0;
      }

      function updateScoreDisplay() {
        document.getElementById('playerScore').textContent = playerScore;
        document.getElementById('aiScore').textContent = aiScore;
        document.getElementById('playerTeamName').textContent = playerTeam.flag + ' ' + playerTeam.code;
        document.getElementById('aiTeamName').textContent = aiTeam.flag + ' ' + aiTeam.code;
      }

      // ==================== AI SYSTEM ====================
      function updateAITeam(squad, isHomeTeam) {
        if (!gameActive) return;
        
        const ballX = ball.x;
        const ballY = ball.y;
        const opponentGoalX = isHomeTeam ? 25 : W - 25;
        
        squad.forEach(player => {
          let targetX = player.x;
          let targetY = player.y;
          
          switch (player.role) {
            case 'GK':
              // Goalkeeper stays near goal line, follows ball vertically
              targetX = isHomeTeam ? 30 : W - 30;
              targetY = Math.min(H - 30, Math.max(30, ballY * 0.8 + H * 0.1));
              break;
              
            case 'DEF':
              // Defenders stay between ball and own goal
              if (isHomeTeam) {
                targetX = Math.min(ballX + 50, 160);
              } else {
                targetX = Math.max(ballX - 50, W - 160);
              }
              targetY = ballY + (player.y > H / 2 ? -20 : 20);
              break;
              
            case 'MID':
              // Midfielders control center, support attack and defense
              targetX = ballX + (isHomeTeam ? -30 : 30);
              targetY = ballY * 0.7 + player.y * 0.3;
              break;
              
            case 'FWD':
              // Forwards attack, stay near opponent goal
              if (isHomeTeam) {
                targetX = Math.max(ballX - 40, 200);
              } else {
                targetX = Math.min(ballX + 40, W - 200);
              }
              targetY = ballY;
              break;
          }
          
          // Clamp targets to field
          targetX = Math.min(W - 20, Math.max(20, targetX));
          targetY = Math.min(H - 20, Math.max(20, targetY));
          
          // Move towards target
          const dx
