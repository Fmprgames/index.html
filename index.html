<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ PRO SOCCER 3D - 11v11 Football Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0a1a0f, #1a2f1a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .game-wrapper {
      background: linear-gradient(180deg, #1e3b2f, #0f281a);
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      padding: 15px;
      max-width: 950px;
      width: 100%;
    }
    
    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.85);
      border-radius: 30px;
      padding: 12px 20px;
      margin-bottom: 12px;
      color: #f7e05e;
      font-weight: bold;
      font-size: 1.2rem;
      border: 2px solid #c9a24d;
      flex-wrap: wrap;
    }
    
    .team-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .team-badge {
      background: #1e3b2a;
      padding: 6px 14px;
      border-radius: 20px;
      color: white;
      font-size: 0.9rem;
      border: 1px solid #c9a24d;
    }
    
    .score-num {
      font-size: 2rem;
      color: #fff;
      min-width: 35px;
      text-align: center;
      text-shadow: 0 0 15px rgba(247,224,94,0.6);
    }
    
    .timer {
      background: rgba(0,0,0,0.5);
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 1.5rem;
      color: #ffd966;
      border: 1px solid #c9a24d;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 25px;
      background: #2d7a2d;
      border: 3px solid #c6a144;
      cursor: pointer;
      touch-action: none;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin-top: 10px;
      background: rgba(0,0,0,0.75);
      border-radius: 25px;
      border: 2px solid #b6963c;
    }
    
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    
    .dpad-row {
      display: flex;
      gap: 6px;
    }
    
    .btn {
      border: none;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
      transition: all 0.08s;
      outline: none;
    }
    
    .d-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #5a7a4a, #1e3312);
      color: white;
      font-size: 1.4rem;
      border: 2px solid #b6a86b;
      box-shadow: 0 4px 0 #0f1f0a, 0 6px 12px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .d-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f1f0a, 0 3px 8px rgba(0,0,0,0.4);
    }
    
    .a-btn {
      padding: 12px 18px;
      border-radius: 25px;
      font-size: 0.9rem;
      border: 2px solid;
      box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 6px 15px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    
    .a-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.5), 0 3px 8px rgba(0,0,0,0.3);
    }
    
    .btn-pass { background: #3498db; color: white; border-color: #5dade2; }
    .btn-shoot { background: #e74c3c; color: white; border-color: #f1948a; }
    .btn-sprint { background: #f39c12; color: #1a1a1a; border-color: #f9e79f; }
    .btn-switch { background: #8e44ad; color: white; border-color: #bb8fce; }
    .btn-restart { background: #27ae60; color: white; border-color: #82e0aa; }
    
    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f7e05e;
      font-size: 0.85rem;
    }
    
    .speed-control input {
      width: 80px;
      accent-color: #f7e05e;
      cursor: pointer;
    }
    
    /* Team Selection Screen */
    .team-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
    }
    
    .team-overlay h1 {
      font-size: 2.2rem;
      color: #f7e05e;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 0 0 30px rgba(247,224,94,0.5);
      padding: 0 20px;
    }
    
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      max-width: 650px;
      padding: 10px;
    }
    
    .team-card {
      background: linear-gradient(180deg, #1e3b2f, #132a1a);
      padding: 15px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border: 2px solid #c9a24d;
      color: white;
      transition: all 0.3s;
      text-align: center;
      min-width: 130px;
    }
    
    .team-card:hover {
      background: linear-gradient(180deg, #c9a24d, #8b6914);
      color: #000;
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(201,162,77,0.4);
    }
    
    @media (max-width: 650px) {
      .scoreboard { font-size: 0.85rem; padding: 8px 10px; }
      .score-num { font-size: 1.3rem; }
      .timer { font-size: 1.1rem; padding: 5px 12px; }
      .d-btn { width: 40px; height: 40px; font-size: 1.1rem; }
      .a-btn { padding: 8px 12px; font-size: 0.75rem; }
      .team-overlay h1 { font-size: 1.5rem; }
      .team-card { padding: 10px 16px; font-size: 0.9rem; min-width: 100px; }
    }
  </style>
</head>
<body>

  <!-- Team Selection Screen -->
  <div id="teamSelectOverlay" class="team-overlay">
    <h1>⚽ আপনার দল বাছাই করুন</h1>
    <div class="team-grid" id="teamGridContainer"></div>
    <p style="color:#ccc; margin-top:20px; font-size:0.9rem;">প্রতিপক্ষ AI স্বয়ংক্রিয়ভাবে নির্বাচিত হবে</p>
  </div>

  <!-- Main Game Container -->
  <div class="game-wrapper">
    <div class="scoreboard">
      <div class="team-info">
        <span class="team-badge" id="playerTeamDisplay">🇧🇷 BRA</span>
        <span class="score-num" id="playerScoreDisplay">0</span>
      </div>
      <div class="timer" id="timerDisplay">90</div>
      <div class="team-info">
        <span class="score-num" id="aiScoreDisplay">0</span>
        <span class="team-badge" id="aiTeamDisplay">🇦🇷 ARG</span>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    
    <div class="controls">
      <div class="dpad">
        <div class="dpad-row"><button class="btn d-btn" id="btnUp">▲</button></div>
        <div class="dpad-row">
          <button class="btn d-btn" id="btnLeft">◀</button>
          <button class="btn d-btn" id="btnDown">▼</button>
          <button class="btn d-btn" id="btnRight">▶</button>
        </div>
      </div>
      <button class="btn a-btn btn-pass" id="btnPass">📤 পাস</button>
      <button class="btn a-btn btn-shoot" id="btnShoot">🥅 শুট</button>
      <button class="btn a-btn btn-sprint" id="btnSprint">💨 স্প্রিন্ট</button>
      <button class="btn a-btn btn-switch" id="btnSwitch">🔄 সুইচ</button>
      <button class="btn a-btn btn-restart" id="btnRestart">↺ রিস্টার্ট</button>
      <div class="speed-control">
        <span>🐢</span>
        <input type="range" id="speedSlider" min="0.3" max="1.2" value="0.6" step="0.05">
        <span>🐇</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============ CANVAS SETUP ============
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const W = 900;
      const H = 500;
      
      // ============ TEAMS DATA ============
      const TEAMS = [
        { name: 'Brazil', code: 'BRA', color: '#FFD700', color2: '#006400', skin: '#F5CBA7', hair: '#2C1810', flag: '🇧🇷' },
        { name: 'Argentina', code: 'ARG', color: '#75AADB', color2: '#FFFFFF', skin: '#E8C39E', hair: '#3B2314', flag: '🇦🇷' },
        { name: 'France', code: 'FRA', color: '#0C1C8C', color2: '#ED2939', skin: '#F5D7B3', hair: '#1A1A2E', flag: '🇫🇷' },
        { name: 'Germany', code: 'GER', color: '#FFFFFF', color2: '#000000', skin: '#FDE0C8', hair: '#8B6914', flag: '🇩🇪' },
        { name: 'England', code: 'ENG', color: '#FFFFFF', color2: '#CF142B', skin: '#F5D0B0', hair: '#4A3728', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
        { name: 'Portugal', code: 'POR', color: '#B22222', color2: '#006400', skin: '#E8C49A', hair: '#2C1810', flag: '🇵🇹' },
        { name: 'Netherlands', code: 'NED', color: '#FF6600', color2: '#FFFFFF', skin: '#F5D5B8', hair: '#8B6914', flag: '🇳🇱' },
        { name: 'Spain', code: 'ESP', color: '#C60B1E', color2: '#FFC400', skin: '#E8C5A0', hair: '#1A1A2E', flag: '🇪🇸' }
      ];
      
      // ============ GAME STATE ============
      let playerTeam = TEAMS[0];
      let aiTeam = TEAMS[1];
      let gameActive = false;
      let gameStarted = false;
      let matchTime = 90;
      let timerInterval = null;
      let playerScore = 0;
      let aiScore = 0;
      let speedMultiplier = 0.6;
      
      // ============ PLAYER CLASS ============
      class Player {
        constructor(x, y, role, side, team) {
          this.x = x;
          this.y = y;
          this.role = role;
          this.side = side;
          this.team = team;
          this.r = 10;
          this.baseSpeed = role === 'GK' ? 1.5 : role === 'DEF' ? 1.8 : role === 'MID' ? 2.0 : 2.2;
          this.animOffset = Math.random() * 100;
          this.number = role === 'GK' ? 1 : Math.floor(Math.random() * 20) + 2;
        }
        getSpeed() { return this.baseSpeed * speedMultiplier; }
      }
      
      // ============ GAME OBJECTS ============
      let homePlayers = [];
      let awayPlayers = [];
      let ball = { x: W/2, y: H/2, vx: 0, vy: 0, r: 7, rot: 0 };
      let controlledIdx = 5;
      
      // ============ INPUT STATE ============
      const keys = { up: false, down: false, left: false, right: false };
      let sprintActive = false;
      let passRequested = false;
      let shootRequested = false;
      
      // ============ CREATE SQUAD ============
      function createSquad(side, team) {
        const squad = [];
        const isHome = side === 'home';
        const goalX = isHome ? 30 : W - 30;
        const goalY = H / 2;
        const dir = isHome ? 1 : -1;
        
        // Goalkeeper
        squad.push(new Player(goalX, goalY, 'GK', side, team));
        
        // 4 Defenders
        const defX = goalX + dir * 55;
        [goalY - 68, goalY - 22, goalY + 22, goalY + 68].forEach(y => {
          squad.push(new Player(defX, y, 'DEF', side, team));
        });
        
        // 4 Midfielders
        const midX = goalX + dir * 165;
        [goalY - 58, goalY - 19, goalY + 19, goalY + 58].forEach(y => {
          squad.push(new Player(midX, y, 'MID', side, team));
        });
        
        // 2 Forwards
        const fwdX = goalX + dir * 255;
        squad.push(new Player(fwdX, goalY - 30, 'FWD', side, team));
        squad.push(new Player(fwdX, goalY + 30, 'FWD', side, team));
        
        return squad;
      }
      
      // ============ RESET GAME ============
      function startNewGame() {
        // Clear old timer
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        
        // Create teams
        homePlayers = createSquad('home', playerTeam);
        awayPlayers = createSquad('away', aiTeam);
        
        // Reset ball
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        ball.rot = 0;
        
        // Reset state
        playerScore = 0;
        aiScore = 0;
        matchTime = 90;
        controlledIdx = 5;
        
        // Activate game
        gameActive = true;
        gameStarted = true;
        
        // Update display
        updateDisplay();
        
        // Start timer
        timerInterval = setInterval(function() {
          if (!gameActive) return;
          matchTime--;
          document.getElementById('timerDisplay').textContent = matchTime;
          if (matchTime <= 0) {
            matchTime = 0;
            document.getElementById('timerDisplay').textContent = '0';
            gameActive = false;
            if (timerInterval) {
              clearInterval(timerInterval);
              timerInterval = null;
            }
          }
        }, 1000);
        
        console.log('Game Started! ' + playerTeam.name + ' vs ' + aiTeam.name);
      }
      
      function updateDisplay() {
        document.getElementById('playerScoreDisplay').textContent = playerScore;
        document.getElementById('aiScoreDisplay').textContent = aiScore;
        document.getElementById('playerTeamDisplay').textContent = playerTeam.flag + ' ' + playerTeam.code;
        document.getElementById('aiTeamDisplay').textContent = aiTeam.flag + ' ' + aiTeam.code;
        document.getElementById('timerDisplay').textContent = matchTime;
      }
      
      // ============ AI SYSTEM ============
      function updateAITeam(squad, isHome) {
        if (!gameActive) return;
        
        squad.forEach(function(p) {
          let targetX = p.x;
          let targetY = p.y;
          const bx = ball.x;
          const by = ball.y;
          
          if (p.role === 'GK') {
            targetX = isHome ? 28 : W - 28;
            targetY = Math.min(H - 30, Math.max(30, by * 0.7 + H * 0.15));
          } else if (p.role === 'DEF') {
            targetX = isHome ? Math.min(bx + 48, 165) : Math.max(bx - 48, W - 165);
            targetY = by + (p.y > H/2 ? -18 : 18);
          } else if (p.role === 'MID') {
            targetX = bx + (isHome ? -28 : 28);
            targetY = by * 0.6 + p.y * 0.4;
          } else if (p.role === 'FWD') {
            targetX = isHome ? Math.max(bx - 35, 210) : Math.min(bx + 35, W - 210);
            targetY = by;
          }
          
          targetX = Math.min(W - 15, Math.max(15, targetX));
          targetY = Math.min(H - 15, Math.max(15, targetY));
          
          const dx = targetX - p.x;
          const dy = targetY - p.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          
          if (dist > 1.5) {
            p.x += (dx/dist) * p.getSpeed() * 0.85;
            p.y += (dy/dist) * p.getSpeed() * 0.85;
          }
          
          // AI kick
          const distToBall = Math.sqrt((p.x-bx)*(p.x-bx) + (p.y-by)*(p.y-by));
          if (distToBall < 22 && Math.random() < 0.03) {
            const goalX = isHome ? 15 : W - 15;
            const angle = Math.atan2(H/2 - p.y + (Math.random()-0.5)*60, goalX - p.x);
            const power = 6.0 * speedMultiplier;
            ball.vx = Math.cos(angle) * power;
            ball.vy = Math.sin(angle) * power;
          }
        });
      }
      
      function updateHomeAIExceptControlled() {
        if (!gameActive) return;
        
        homePlayers.forEach(function(p, i) {
          if (i === controlledIdx) return;
          
          let targetX = p.x;
          let targetY = p.y;
          const bx = ball.x;
          const by = ball.y;
          
          if (p.role === 'GK') {
            targetX = W - 28;
            targetY = Math.min(H - 30, Math.max(30, by * 0.7 + H * 0.15));
          } else if (p.role === 'DEF') {
            targetX = Math.max(bx - 48, W - 165);
            targetY = by + (p.y > H/2 ? -18 : 18);
          } else if (p.role === 'MID') {
            targetX = bx - 28;
            targetY = by * 0.6 + p.y * 0.4;
          } else if (p.role === 'FWD') {
            targetX = Math.min(bx + 35, W - 210);
            targetY = by;
          }
          
          targetX = Math.min(W - 15, Math.max(15, targetX));
          targetY = Math.min(H - 15, Math.max(15, targetY));
          
          const dx = targetX - p.x;
          const dy = targetY - p.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          
          if (dist > 1.5) {
            p.x += (dx/dist) * p.getSpeed() * 0.8;
            p.y += (dy/dist) * p.getSpeed() * 0.8;
          }
        });
      }
      
      // ============ BALL PHYSICS ============
      function updateBall() {
        if (!gameActive) return;
        
        ball.vx *= 0.985;
        ball.vy *= 0.985;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.rot += ball.vx * 0.04;
        
        // Top/Bottom walls
        if (ball.y < 8) { ball.y = 8; ball.vy *= -0.5; }
        if (ball.y > H - 8) { ball.y = H - 8; ball.vy *= -0.5; }
        
        // Goals
        if (ball.x < 15 && ball.y > H*0.32 && ball.y < H*0.68) {
          aiScore++;
          updateDisplay();
          resetBallPosition();
          return;
        }
        if (ball.x > W - 15 && ball.y > H*0.32 && ball.y < H*0.68) {
          playerScore++;
          updateDisplay();
          resetBallPosition();
          return;
        }
        
        // Left/Right walls
        if (ball.x < 8 && !(ball.y > H*0.32 && ball.y < H*0.68)) {
          ball.x = 8;
          ball.vx *= -0.4;
        }
        if (ball.x > W - 8 && !(ball.y > H*0.32 && ball.y < H*0.68)) {
          ball.x = W - 8;
          ball.vx *= -0.4;
        }
        
        // Player collisions
        const allPlayers = homePlayers.concat(awayPlayers);
        allPlayers.forEach(function(p) {
          const dx = ball.x - p.x;
          const dy = ball.y - p.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const minDist = ball.r + p.r;
          
          if (dist < minDist && dist > 0.01) {
            const angle = Math.atan2(dy, dx);
            ball.x += Math.cos(angle) * (minDist - dist);
            ball.y += Math.sin(angle) * (minDist - dist);
            
            const nx = dx / dist;
            const ny = dy / dist;
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
              ball.vx -= 1.5 * vn * nx;
              ball.vy -= 1.5 * vn * ny;
            }
          }
        });
        
        // Speed limit
        const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
        if (speed > 9) {
          ball.vx *= 9 / speed;
          ball.vy *= 9 / speed;
        }
        if (Math.abs(ball.vx) < 0.03) ball.vx = 0;
        if (Math.abs(ball.vy) < 0.03) ball.vy = 0;
      }
      
      function resetBallPosition() {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        ball.rot = 0;
      }
      
      // ============ PLAYER CONTROL ============
      function moveControlledPlayer() {
        if (!gameActive || controlledIdx >= homePlayers.length) return;
        
        const p = homePlayers[controlledIdx];
        let moveX = 0;
        let moveY = 0;
        
        if (keys.right) moveX += 1;
        if (keys.left) moveX -= 1;
        if (keys.down) moveY += 1;
        if (keys.up) moveY -= 1;
        
        if (moveX !== 0 || moveY !== 0) {
          const len = Math.sqrt(moveX*moveX + moveY*moveY);
          const speed = sprintActive ? p.getSpeed() * 1.5 : p.getSpeed();
          p.x += (moveX/len) * speed;
          p.y += (moveY/len) * speed;
          p.x = Math.min(W - 12, Math.max(12, p.x));
          p.y = Math.min(H - 12, Math.max(12, p.y));
        }
        
        // Pass
        if (passRequested) {
          passRequested = false;
          let bestTarget = null;
          let bestDist = 180;
          
          homePlayers.forEach(function(tp, i) {
            if (i === controlledIdx) return;
            const d = Math.sqrt((tp.x-p.x)*(tp.x-p.x) + (tp.y-p.y)*(tp.y-p.y));
            if (d < bestDist) {
              bestDist = d;
              bestTarget = tp;
            }
          });
          
          if (bestTarget) {
            const angle = Math.atan2(bestTarget.y - p.y, bestTarget.x - p.x);
            ball.vx = Math.cos(angle) * 7;
            ball.vy = Math.sin(angle) * 5;
          }
        }
        
        // Shoot
        if (shootRequested) {
          shootRequested = false;
          const angle = Math.atan2(H/2 - p.y + (Math.random()-0.5)*70, 15 - p.x);
          ball.vx = Math.cos(angle) * 8.5;
          ball.vy = Math.sin(angle) * 5.5;
        }
      }
      
      function switchPlayer() {
        let bestIdx = controlledIdx;
        let bestDist = Infinity;
        
        homePlayers.forEach(function(p, i) {
          if (i === controlledIdx || p.role === 'GK') return;
          const d = Math.sqrt((p.x-ball.x)*(p.x-ball.x) + (p.y-ball.y)*(p.y-ball.y));
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        });
        
        controlledIdx = bestIdx;
      }
      
      // ============ RENDERING ============
      function drawPitch() {
        ctx.clearRect(0, 0, W, H);
        
        // Grass gradient
        const grassGrad = ctx.createLinearGradient(0, 0, 0, H);
        grassGrad.addColorStop(0, '#3a8a32');
        grassGrad.addColorStop(0.5, '#4a9e3a');
        grassGrad.addColorStop(1, '#2d6a1f');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, 0, W, H);
        
        // Stripes
        for (let i = 0; i < W; i += 55) {
          ctx.fillStyle = i % 110 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
          ctx.fillRect(i, 0, 27, H);
        }
        
        // Center line
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W/2, 0);
        ctx.lineTo(W/2, H);
        ctx.stroke();
        
        // Center circle
        ctx.beginPath();
        ctx.arc(W/2, H/2, 70, 0, Math.PI * 2);
        ctx.stroke();
        
        // Center dot
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(W/2, H/2, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Goal areas
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, H*0.32, 35, H*0.36);
        ctx.fillRect(W-35, H*0.32, 35, H*0.36);
        
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, H*0.32, 35, H*0.36);
        ctx.strokeRect(W-35, H*0.32, 35, H*0.36);
        
        // Goal nets
        drawGoalNet(8, H*0.32, H*0.68);
        drawGoalNet(W-8, H*0.32, H*0.68);
      }
      
      function drawGoalNet(x, yTop, yBottom) {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x-5, yTop, 10, yBottom - yTop);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 0.5;
        for (let y = yTop; y < yBottom; y += 12) {
          ctx.beginPath();
          ctx.moveTo(x-5, y);
          ctx.lineTo(x+5, y);
          ctx.stroke();
        }
      }
      
      function drawPlayer(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 6, 9, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Legs with animation
        const legSwing = Math.sin(Date.now() * 0.012 + p.animOffset) * 3;
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(-2, 2);
        ctx.lineTo(-3, 13 + legSwing);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(2, 2);
        ctx.lineTo(3, 13 - legSwing);
        ctx.stroke();
        
        // Body
        const bodyGrad = ctx.createLinearGradient(0, -4, 0, 7);
        bodyGrad.addColorStop(0, p.team.color);
        bodyGrad.addColorStop(1, p.team.color2);
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, -1, 6.5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Arms
        ctx.strokeStyle = p.team.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-5, -2);
        ctx.lineTo(-9, 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(5, -2);
        ctx.lineTo(9, 5);
        ctx.stroke();
        
        // Head
        ctx.fillStyle = p.team.skin;
        ctx.beginPath();
        ctx.arc(0, -11, 7, 0, Math.PI * 2);
        ctx.fill();
        
        // Hair
        ctx.fillStyle = p.team.hair;
        ctx.beginPath();
        ctx.arc(0, -13, 7, 0, Math.PI);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(-2, -11, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(2, -11, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Pupils
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(-2, -11, 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(2, -11, 0.7, 0, Math.PI * 2);
        ctx.fill();
        
        // Jersey number
        ctx.fillStyle = 'white';
        ctx.font = 'bold 6px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.number, 0, 2);
        
        // Controlled player indicator
        if (p.side === 'home' && homePlayers.indexOf(p) === controlledIdx && gameActive) {
          ctx.strokeStyle = '#FFD700';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.stroke();
          
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.moveTo(0, -17);
          ctx.lineTo(-4, -13);
          ctx.lineTo(4, -13);
          ctx.closePath();
          ctx.fill();
        }
        
        ctx.restore();
      }
      
      function drawBall() {
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rot);
        
        // Ball shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(0, 1, ball.r, 0, Math.PI * 2);
        ctx.fill();
        
        // Ball body
        const ballGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.r);
        ballGrad.addColorStop(0, '#FFFFFF');
        ballGrad.addColorStop(0.7, '#DDDDDD');
        ballGrad.addColorStop(1, '#999999');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
        ctx.fill();
        
        // Outline
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Pentagon pattern
        for (let i = 0; i < 5; i++) {
          const angle = i * Math.PI * 2 / 5;
          ctx.strokeStyle = '#444';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle) * 6, Math.sin(angle) * 6);
          ctx.stroke();
        }
        
        ctx.restore();
      }
      
      function render() {
        drawPitch();
        
        // Draw away players first (behind)
        awayPlayers.forEach(function(p) { drawPlayer(p); });
        
        // Draw ball
        drawBall();
        
        // Draw home players
        homePlayers.forEach(function(p) { drawPlayer(p); });
        
        // Game over overlay
        if (!gameActive && gameStarted) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, W, H);
          
          ctx.fillStyle = '#FFD700';
          ctx.font = 'bold 38px Arial';
          ctx.textAlign = 'center';
          
          let message = 'ম্যাচ শেষ!';
          if (playerScore > aiScore) message = '🎉 আপনি জিতেছেন!';
          else if (aiScore > playerScore) message = '😞 AI জিতেছে';
          else message = '🤝 ড্র হয়েছে';
          
          ctx.fillText(message, W/2, H/2 - 15);
          
          ctx.font = 'bold 20px Arial';
          ctx.fillText('রিস্টার্ট বাটনে ক্লিক করুন', W/2, H/2 + 40);
        }
      }
      
      // ============ GAME LOOP ============
      function gameLoop() {
        if (gameActive) {
          moveControlledPlayer();
          updateHomeAIExceptControlled();
          updateAITeam(awayPlayers, false);
          updateBall();
        }
        
        render();
        requestAnimationFrame(gameLoop);
      }
      
      // ============ EVENT HANDLERS ============
      
      // Keyboard controls
      window.addEventListener('keydown', function(e) {
        switch(e.key.toLowerCase()) {
          case 'w': case 'arrowup': keys.up = true; e.preventDefault(); break;
          case 's': case 'arrowdown': keys.down = true; e.preventDefault(); break;
          case 'a': case 'arrowleft': keys.left = true; e.preventDefault(); break;
          case 'd': case 'arrowright': keys.right = true; e.preventDefault(); break;
          case 'shift': sprintActive = true; e.preventDefault(); break;
          case ' ': shootRequested = true; e.preventDefault(); break;
          case 'q': passRequested = true; e.preventDefault(); break;
          case 'tab': switchPlayer(); e.preventDefault(); break;
        }
      });
      
      window.addEventListener('keyup', function(e) {
        switch(e.key.toLowerCase()) {
          case 'w': case 'arrowup': keys.up = false; break;
          case 's': case 'arrowdown': keys.down = false; break;
          case 'a': case 'arrowleft': keys.left = false; break;
          case 'd': case 'arrowright': keys.right = false; break;
          case 'shift': sprintActive = false; break;
        }
      });
      
      // Mobile D-Pad buttons
      function setupDPadButton(id, keyProperty) {
        const btn = document.getElementById(id);
        if (!btn) return;
        
        btn.addEventListener('mousedown', function(e) {
          e.preventDefault();
          keys[keyProperty] = true;
        });
        
        btn.addEventListener('mouseup', function(e) {
          e.preventDefault();
          keys[keyProperty] = false;
        });
        
        btn.addEventListener('mouseleave', function(e) {
          keys[keyProperty] = false;
        });
        
        btn.addEventListener('touchstart', function(e) {
          e.preventDefault();
          keys[keyProperty] = true;
        });
        
        btn.addEventListener('touchend', function(e) {
          e.preventDefault();
          keys[keyProperty] = false;
        });
        
        btn.addEventListener('touchcancel', function(e) {
          keys[keyProperty] = false;
        });
      }
      
      setupDPadButton('btnUp', 'up');
      setupDPadButton('btnDown', 'down');
      setupDPadButton('btnLeft', 'left');
      setupDPadButton('btnRight', 'right');
      
      // Sprint button
      const sprintBtn = document.getElementById('btnSprint');
      if (sprintBtn) {
        sprintBtn.addEventListener('mousedown', function(e) { e.preventDefault(); sprintActive = true; });
        sprintBtn.addEventListener('mouseup', function(e) { e.preventDefault(); sprintActive = false; });
        sprintBtn.addEventListener('mouseleave', function(e) { sprintActive = false; });
        sprintBtn.addEventListener('touchstart', function(e) { e.preventDefault(); sprintActive = true; });
        sprintBtn.addEventListener('touchend', function(e) { e.preventDefault(); sprintActive = false; });
      }
      
      // Pass button
      document.getElementById('btnPass')?.addEventListener('click', function(e) {
        e.preventDefault();
        passRequested = true;
      });
      
      // Shoot button
      document.getElementById('btnShoot')?.addEventListener('click', function(e) {
        e.preventDefault();
        shootRequested = true;
      });
      
      // Switch button
      document.getElementById('btnSwitch')?.addEventListener('click', function(e) {
        e.preventDefault();
        switchPlayer();
      });
      
      // Restart button
      document.getElementById('btnRestart')?.addEventListener('click', function(e) {
        e.preventDefault();
        startNewGame();
      });
      
      // Speed slider
      document.getElementById('speedSlider')?.addEventListener('input', function(e) {
        speedMultiplier = parseFloat(e.target.value);
      });
      
      // ============ TEAM SELECTION ============
      function setupTeamSelection() {
        const grid = document.getElementById('teamGridContainer');
        if (!grid) {
          console.error('Team grid not found!');
          return;
        }
        
        grid.innerHTML = '';
        
        TEAMS.forEach(function(team, index) {
          const card = document.createElement('div');
          card.className = 'team-card';
          card.textContent = team.flag + ' ' + team.name;
          card.style.cursor = 'pointer';
          
          card.addEventListener('click', function() {
            console.log('Team selected: ' + team.name);
            playerTeam = team;
            aiTeam = TEAMS[(index + 1) % TEAMS.length];
            
            // Hide overlay
            const overlay = document.getElementById('teamSelectOverlay');
            if (overlay) {
              overlay.style.display = 'none';
            }
            
            // Start the game
            startNewGame();
          });
          
          grid.appendChild(card);
        });
        
        console.log('Team selection setup complete. ' + TEAMS.length + ' teams loaded.');
      }
      
      // ============ INITIALIZATION ============
      function init() {
        console.log('Initializing game...');
        
        // Setup team selection
        setupTeamSelection();
        
        // Update display
        updateDisplay();
        
        // Don't start game yet - wait for team selection
        gameActive = false;
        gameStarted = false;
        
        // Start rendering loop
        gameLoop();
        
        console.log('Game initialized. Waiting for team selection...');
      }
      
      // Start everything
      init();
      
    })();
  </script>
</body>
</html>
