<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ PRO SOCCER 3D - 11v11 Football</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a1a0f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .game-container {
      background: #1a3525;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      padding: 10px;
      max-width: 920px;
      width: 100%;
    }
    
    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.8);
      border-radius: 30px;
      padding: 10px 20px;
      margin-bottom: 10px;
      color: #f7e05e;
      font-weight: bold;
      font-size: 1.3rem;
      border: 2px solid #c9a24d;
      flex-wrap: wrap;
    }
    
    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .team-badge {
      background: #1e3b2a;
      padding: 5px 12px;
      border-radius: 20px;
      color: white;
      font-size: 0.9rem;
    }
    
    .score-num {
      font-size: 1.8rem;
      color: white;
      min-width: 30px;
      text-align: center;
    }
    
    .timer {
      background: rgba(0,0,0,0.5);
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 1.4rem;
      color: #ffd966;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      background: #2d7a2d;
      border: 3px solid #c6a144;
      cursor: pointer;
      touch-action: none;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-top: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 25px;
      border: 1px solid #b6963c;
    }
    
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    
    .dpad-row {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      border: none;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
      transition: 0.1s;
    }
    
    .d-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #2e4b2e;
      color: white;
      font-size: 1.3rem;
      border: 2px solid #8a9a6a;
      box-shadow: 0 3px 0 #1a2a1a;
    }
    
    .d-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1a2a1a;
    }
    
    .a-btn {
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 2px solid;
      box-shadow: 0 3px 0 rgba(0,0,0,0.5);
    }
    
    .a-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.5);
    }
    
    .btn-pass { background: #3498db; color: white; border-color: #5dade2; }
    .btn-shoot { background: #e74c3c; color: white; border-color: #f1948a; }
    .btn-sprint { background: #f39c12; color: #1a1a1a; border-color: #f9e79f; }
    .btn-switch { background: #8e44ad; color: white; border-color: #bb8fce; }
    .btn-restart { background: #27ae60; color: white; border-color: #82e0aa; }
    
    .speed-control {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #f7e05e;
      font-size: 0.8rem;
    }
    
    .speed-control input {
      width: 70px;
      accent-color: #f7e05e;
    }
    
    /* Team Selection */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: white;
    }
    
    .overlay h1 {
      font-size: 2rem;
      color: #f7e05e;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
      padding: 10px;
    }
    
    .team-card {
      background: #1e3b2f;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      border: 2px solid #c9a24d;
      color: white;
      transition: 0.2s;
    }
    
    .team-card:hover {
      background: #c9a24d;
      color: black;
      transform: scale(1.05);
    }
    
    @media (max-width: 600px) {
      .scoreboard { font-size: 0.9rem; padding: 8px 10px; }
      .score-num { font-size: 1.3rem; }
      .timer { font-size: 1rem; padding: 5px 10px; }
      .d-btn { width: 38px; height: 38px; font-size: 1.1rem; }
      .a-btn { padding: 8px 12px; font-size: 0.75rem; }
      .overlay h1 { font-size: 1.5rem; }
      .team-card { padding: 10px 15px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- Team Selection -->
  <div id="teamScreen" class="overlay">
    <h1>⚽ আপনার দল বাছাই করুন</h1>
    <div class="team-grid" id="teamGrid"></div>
  </div>

  <!-- Game -->
  <div class="game-container">
    <div class="scoreboard">
      <div class="team-info">
        <span class="team-badge" id="playerName">🇧🇷 BRA</span>
        <span class="score-num" id="playerScore">0</span>
      </div>
      <div class="timer" id="timerDisplay">90</div>
      <div class="team-info">
        <span class="score-num" id="aiScore">0</span>
        <span class="team-badge" id="aiName">🇦🇷 ARG</span>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    
    <div class="controls">
      <div class="dpad">
        <div class="dpad-row"><button class="btn d-btn" id="btnUp">▲</button></div>
        <div class="dpad-row">
          <button class="btn d-btn" id="btnLeft">◀</button>
          <button class="btn d-btn" id="btnDown">▼</button>
          <button class="btn d-btn" id="btnRight">▶</button>
        </div>
      </div>
      <button class="btn a-btn btn-pass" id="btnPass">📤 পাস</button>
      <button class="btn a-btn btn-shoot" id="btnShoot">🥅 শুট</button>
      <button class="btn a-btn btn-sprint" id="btnSprint">💨 স্প্রিন্ট</button>
      <button class="btn a-btn btn-switch" id="btnSwitch">🔄 সুইচ</button>
      <button class="btn a-btn btn-restart" id="btnRestart">↺ রিস্টার্ট</button>
      <div class="speed-control">
        🐢<input type="range" id="speedSlider" min="0.3" max="1.2" value="0.6" step="0.05">🐇
      </div>
    </div>
  </div>

  <script>
    // ========== GAME ENGINE ==========
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const W = 900, H = 500;
      
      // Teams
      const TEAMS = [
        { name: 'Brazil', code: 'BRA', color: '#FFD700', color2: '#006400', skin: '#F5CBA7', hair: '#2C1810', flag: '🇧🇷' },
        { name: 'Argentina', code: 'ARG', color: '#75AADB', color2: '#FFFFFF', skin: '#E8C39E', hair: '#3B2314', flag: '🇦🇷' },
        { name: 'France', code: 'FRA', color: '#0C1C8C', color2: '#ED2939', skin: '#F5D7B3', hair: '#1A1A2E', flag: '🇫🇷' },
        { name: 'Germany', code: 'GER', color: '#FFFFFF', color2: '#000000', skin: '#FDE0C8', hair: '#8B6914', flag: '🇩🇪' },
        { name: 'England', code: 'ENG', color: '#FFFFFF', color2: '#CF142B', skin: '#F5D0B0', hair: '#4A3728', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
        { name: 'Portugal', code: 'POR', color: '#B22222', color2: '#006400', skin: '#E8C49A', hair: '#2C1810', flag: '🇵🇹' },
        { name: 'Netherlands', code: 'NED', color: '#FF6600', color2: '#FFFFFF', skin: '#F5D5B8', hair: '#8B6914', flag: '🇳🇱' },
        { name: 'Spain', code: 'ESP', color: '#C60B1E', color2: '#FFC400', skin: '#E8C5A0', hair: '#1A1A2E', flag: '🇪🇸' }
      ];
      
      // State
      let playerTeam = TEAMS[0];
      let aiTeam = TEAMS[1];
      let gameActive = false;
      let gameStarted = false;
      let matchTime = 90;
      let timerInterval = null;
      let playerScore = 0, aiScore = 0;
      let speedMultiplier = 0.6;
      
      // Player class
      class Player {
        constructor(x, y, role, side, team) {
          this.x = x; this.y = y;
          this.role = role;
          this.side = side;
          this.team = team;
          this.r = 10;
          this.speed = role === 'GK' ? 1.5 : role === 'DEF' ? 1.8 : role === 'MID' ? 2.0 : 2.2;
          this.anim = Math.random() * 100;
          this.num = role === 'GK' ? 1 : Math.floor(Math.random() * 20) + 2;
        }
        getSpeed() { return this.speed * speedMultiplier; }
      }
      
      // Game objects
      let homePlayers = [];
      let awayPlayers = [];
      let ball = { x: W/2, y: H/2, vx: 0, vy: 0, r: 7, rot: 0 };
      let controlledIdx = 5;
      
      // Input
      const keys = { up: false, down: false, left: false, right: false };
      let sprint = false;
      let wantPass = false;
      let wantShoot = false;
      
      // Create squad
      function makeSquad(side, team) {
        const s = [];
        const isHome = side === 'home';
        const gx = isHome ? 25 : W - 25;
        const gy = H / 2;
        
        // GK
        s.push(new Player(gx, gy, 'GK', side, team));
        
        // Defenders
        [gy-70, gy-23, gy+23, gy+70].forEach(y => {
          s.push(new Player(gx + (isHome ? 60 : -60), y, 'DEF', side, team));
        });
        
        // Midfielders
        [gy-60, gy-20, gy+20, gy+60].forEach(y => {
          s.push(new Player(gx + (isHome ? 170 : -170), y, 'MID', side, team));
        });
        
        // Forwards
        s.push(new Player(gx + (isHome ? 260 : -260), gy-32, 'FWD', side, team));
        s.push(new Player(gx + (isHome ? 260 : -260), gy+32, 'FWD', side, team));
        
        return s;
      }
      
      // Reset
      function resetGame() {
        if (timerInterval) clearInterval(timerInterval);
        homePlayers = makeSquad('home', playerTeam);
        awayPlayers = makeSquad('away', aiTeam);
        ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0; ball.rot = 0;
        playerScore = 0; aiScore = 0; matchTime = 90;
        controlledIdx = 5;
        gameActive = true; gameStarted = true;
        updateUI();
        timerInterval = setInterval(() => {
          if (!gameActive) return;
          matchTime--;
          document.getElementById('timerDisplay').textContent = matchTime;
          if (matchTime <= 0) { matchTime = 0; gameActive = false; clearInterval(timerInterval); }
        }, 1000);
      }
      
      function updateUI() {
        document.getElementById('playerScore').textContent = playerScore;
        document.getElementById('aiScore').textContent = aiScore;
        document.getElementById('playerName').textContent = playerTeam.flag + ' ' + playerTeam.code;
        document.getElementById('aiName').textContent = aiTeam.flag + ' ' + aiTeam.code;
        document.getElementById('timerDisplay').textContent = matchTime;
      }
      
      // AI
      function updateAI(squad, isHome) {
        if (!gameActive) return;
        squad.forEach(p => {
          let tx = p.x, ty = p.y;
          const bx = ball.x, by = ball.y;
          
          if (p.role === 'GK') {
            tx = isHome ? 28 : W - 28;
            ty = Math.min(H-30, Math.max(30, by * 0.7 + H * 0.15));
          } else if (p.role === 'DEF') {
            tx = isHome ? Math.min(bx + 50, 170) : Math.max(bx - 50, W - 170);
            ty = by + (p.y > H/2 ? -18 : 18);
          } else if (p.role === 'MID') {
            tx = bx + (isHome ? -25 : 25);
            ty = by * 0.6 + p.y * 0.4;
          } else if (p.role === 'FWD') {
            tx = isHome ? Math.max(bx - 35, 210) : Math.min(bx + 35, W - 210);
            ty = by;
          }
          
          tx = Math.min(W-15, Math.max(15, tx));
          ty = Math.min(H-15, Math.max(15, ty));
          
          const dx = tx - p.x, dy = ty - p.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d > 1) {
            p.x += (dx/d) * p.getSpeed() * 0.85;
            p.y += (dy/d) * p.getSpeed() * 0.85;
          }
          
          // AI kick
          if (Math.sqrt((p.x-bx)**2 + (p.y-by)**2) < 22 && Math.random() < 0.03) {
            const goalX = isHome ? 20 : W - 20;
            const a = Math.atan2(H/2 - p.y, goalX - p.x);
            ball.vx = Math.cos(a) * 6;
            ball.vy = Math.sin(a) * 5;
          }
        });
      }
      
      // Home AI except controlled
      function updateHomeAI() {
        if (!gameActive) return;
        homePlayers.forEach((p, i) => {
          if (i === controlledIdx) return;
          let tx = p.x, ty = p.y;
          const bx = ball.x, by = ball.y;
          
          if (p.role === 'GK') {
            tx = W - 28;
            ty = Math.min(H-30, Math.max(30, by * 0.7 + H * 0.15));
          } else if (p.role === 'DEF') {
            tx = Math.max(bx - 50, W - 170);
            ty = by + (p.y > H/2 ? -18 : 18);
          } else if (p.role === 'MID') {
            tx = bx - 25;
            ty = by * 0.6 + p.y * 0.4;
          } else if (p.role === 'FWD') {
            tx = Math.min(bx + 35, W - 210);
            ty = by;
          }
          
          tx = Math.min(W-15, Math.max(15, tx));
          ty = Math.min(H-15, Math.max(15, ty));
          
          const dx = tx - p.x, dy = ty - p.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d > 1) {
            p.x += (dx/d) * p.getSpeed() * 0.8;
            p.y += (dy/d) * p.getSpeed() * 0.8;
          }
        });
      }
      
      // Ball physics
      function updateBall() {
        if (!gameActive) return;
        ball.vx *= 0.985;
        ball.vy *= 0.985;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.rot += ball.vx * 0.04;
        
        if (ball.y < 8) { ball.y = 8; ball.vy *= -0.5; }
        if (ball.y > H - 8) { ball.y = H - 8; ball.vy *= -0.5; }
        
        // Goals
        if (ball.x < 15 && ball.y > H*0.32 && ball.y < H*0.68) {
          aiScore++; updateUI(); resetBall();
        }
        if (ball.x > W - 15 && ball.y > H*0.32 && ball.y < H*0.68) {
          playerScore++; updateUI(); resetBall();
        }
        
        // Walls
        if (ball.x < 8 && !(ball.y > H*0.32 && ball.y < H*0.68)) { ball.x = 8; ball.vx *= -0.4; }
        if (ball.x > W - 8 && !(ball.y > H*0.32 && ball.y < H*0.68)) { ball.x = W - 8; ball.vx *= -0.4; }
        
        // Player collisions
        [...homePlayers, ...awayPlayers].forEach(p => {
          const dx = ball.x - p.x, dy = ball.y - p.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          const min = ball.r + p.r;
          if (d < min && d > 0.01) {
            const a = Math.atan2(dy, dx);
            ball.x += Math.cos(a) * (min - d);
            ball.y += Math.sin(a) * (min - d);
            const nv = ball.vx * (dx/d) + ball.vy * (dy/d);
            if (nv < 0) {
              ball.vx -= 1.5 * nv * (dx/d);
              ball.vy -= 1.5 * nv * (dy/d);
            }
          }
        });
        
        const sp = Math.sqrt(ball.vx**2 + ball.vy**2);
        if (sp > 9) { ball.vx *= 9/sp; ball.vy *= 9/sp; }
        if (Math.abs(ball.vx) < 0.03) ball.vx = 0;
        if (Math.abs(ball.vy) < 0.03) ball.vy = 0;
      }
      
      function resetBall() {
        ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
      }
      
      // Control
      function moveControlled() {
        if (!gameActive || controlledIdx >= homePlayers.length) return;
        const p = homePlayers[controlledIdx];
        let mx = 0, my = 0;
        if (keys.right) mx += 1;
        if (keys.left) mx -= 1;
        if (keys.down) my += 1;
        if (keys.up) my -= 1;
        
        if (mx !== 0 || my !== 0) {
          const len = Math.sqrt(mx*mx + my*my);
          const sp = sprint ? p.getSpeed() * 1.5 : p.getSpeed();
          p.x += (mx/len) * sp;
          p.y += (my/len) * sp;
          p.x = Math.min(W-12, Math.max(12, p.x));
          p.y = Math.min(H-12, Math.max(12, p.y));
        }
        
        if (wantPass) {
          wantPass = false;
          let best = null, bestD = 180;
          homePlayers.forEach((tp, i) => {
            if (i === controlledIdx) return;
            const d = Math.sqrt((tp.x-p.x)**2 + (tp.y-p.y)**2);
            if (d < bestD) { bestD = d; best = tp; }
          });
          if (best) {
            const a = Math.atan2(best.y - p.y, best.x - p.x);
            ball.vx = Math.cos(a) * 7;
            ball.vy = Math.sin(a) * 5;
          }
        }
        
        if (wantShoot) {
          wantShoot = false;
          const a = Math.atan2(H/2 - p.y, 15 - p.x);
          ball.vx = Math.cos(a) * 8.5;
          ball.vy = Math.sin(a) * 5.5;
        }
      }
      
      function switchPlayer() {
        let best = controlledIdx, bestD = Infinity;
        homePlayers.forEach((p, i) => {
          if (i === controlledIdx || p.role === 'GK') return;
          const d = Math.sqrt((p.x-ball.x)**2 + (p.y-ball.y)**2);
          if (d < bestD) { bestD = d; best = i; }
        });
        controlledIdx = best;
      }
      
      // Draw
      function draw() {
        ctx.clearRect(0, 0, W, H);
        
        // Grass
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#3a8a32'); g.addColorStop(0.5, '#4a9e3a'); g.addColorStop(1, '#2d6a1f');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        
        // Stripes
        for (let i = 0; i < W; i += 55) {
          ctx.fillStyle = i % 110 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
          ctx.fillRect(i, 0, 27, H);
        }
        
        // Lines
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
        ctx.beginPath(); ctx.arc(W/2, H/2, 70, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(W/2, H/2, 4, 0, Math.PI*2); ctx.fill();
        
        // Goal areas
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, H*0.32, 35, H*0.36);
        ctx.fillRect(W-35, H*0.32, 35, H*0.36);
        ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
        ctx.strokeRect(0, H*0.32, 35, H*0.36);
        ctx.strokeRect(W-35, H*0.32, 35, H*0.36);
        
        // Goal nets
        [8, W-8].forEach(gx => {
          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          ctx.fillRect(gx-4, H*0.32, 8, H*0.36);
          for (let y = H*0.32; y < H*0.68; y += 12) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(gx-4, y); ctx.lineTo(gx+4, y); ctx.stroke();
          }
        });
        
        // Players
        [...homePlayers, ...awayPlayers].forEach(p => {
          ctx.save(); ctx.translate(p.x, p.y);
          
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath();
          ctx.ellipse(0, 6, 9, 3, 0, 0, Math.PI*2); ctx.fill();
          
          // Legs
          const swing = Math.sin(Date.now()*0.01 + p.anim) * 3;
          ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(-3, 13 + swing); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(2, 2); ctx.lineTo(3, 13 - swing); ctx.stroke();
          
          // Body
          const bg = ctx.createLinearGradient(0, -4, 0, 7);
          bg.addColorStop(0, p.team.color); bg.addColorStop(1, p.team.color2);
          ctx.fillStyle = bg;
          ctx.beginPath(); ctx.ellipse(0, -1, 6.5, 9, 0, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
          
          // Arms
