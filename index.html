<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Penalty Shootout</title>

<style>
body{
margin:0;
background:#1b5e20;
font-family:Arial;
text-align:center;
overflow:hidden;
}

#ui{
color:white;
font-size:28px;
padding:10px;
}

canvas{
background:#43a047;
display:block;
margin:auto;
}

#shootBtn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:120px;
height:60px;
font-size:24px;
border:none;
border-radius:15px;
}
</style>
</head>
<body>

<div id="ui">
Score: <span id="score">0</span> |
Shots: <span id="shots">5</span>
</div>

<canvas id="game" width="900" height="500"></canvas>

<button id="shootBtn">⚽ SHOOT</button>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let shots=5;

const ball={
x:450,
y:420,
r:12
};

const keeper={
x:400,
y:80,
w:100,
h:20
};

let moving=false;
let ballX=450;
let ballY=420;

function resetBall(){
ballX=450;
ballY=420;
moving=false;
}

document.getElementById("shootBtn").onclick=()=>{

if(moving || shots<=0) return;

shots--;
document.getElementById("shots").innerText=shots;

moving=true;

keeper.x=Math.random()*700+100;

};

function update(){

if(moving){

ballY-=8;

if(ballY<100){

if(ballX>keeper.x &&
ballX<keeper.x+keeper.w){

alert("Saved!");

}else{

score++;
document.getElementById("score").innerText=score;

alert("GOAL!");

}

resetBall();

if(shots===0){

setTimeout(()=>{

if(score>=3)
alert("YOU WIN!");

else
alert("YOU LOSE!");

},200);

}

}

}

}

canvas.addEventListener("click",(e)=>{

const rect=canvas.getBoundingClientRect();

ballX=e.clientX-rect.left;

});

function draw(){

ctx.clearRect(0,0,900,500);

ctx.fillStyle="white";

ctx.fillRect(300,40,300,60);

ctx.fillStyle="red";

ctx.fillRect(
keeper.x,
keeper.y,
keeper.w,
keeper.h
);

ctx.beginPath();
ctx.arc(ballX,ballY,12,0,Math.PI*2);
ctx.fill();

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}

loop();

</script>
</body>
</html>
